[build]
builder = "NIXPACKS"
buildCommand = "python -m pip install --upgrade pip && pip install wheel setuptools && pip install -r requirements.txt"

[deploy]
startCommand = "gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PYTHON_VERSION = "3.9"
PORT = "8000" 