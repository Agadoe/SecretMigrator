[build]
builder = "NIXPACKS"
buildCommand = """
export PYTHONPATH=/nix/store/python39/lib/python3.9/site-packages:$PYTHONPATH && \
python3.9 -m pip install --upgrade pip setuptools wheel && \
python3.9 -m pip install -r requirements.txt
"""

[deploy]
startCommand = "python main.py"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PYTHON_VERSION = "3.9"
NIXPACKS_PYTHON_VERSION = "3.9"
PIP_VERSION = "23.3.1"
PORT = "8000"

[phases.setup]
nixPkgs = [
    "gcc",
    "python39",
    "python39.pkgs.pip",
    "python39.pkgs.setuptools",
    "python39.pkgs.wheel",
    "python39.pkgs.distutils-extra",
    "python39.pkgs.venv",
    "make",
    "libffi",
    "openssl",
    "pkg-config"
]

[phases.build]
cmds = [
    "python3.9 -m venv /opt/venv",
    "export PYTHONPATH=/opt/venv/lib/python3.9/site-packages:$PYTHONPATH",
    "source /opt/venv/bin/activate",
    "which python",
    "python --version",
    "python -m pip install --upgrade pip setuptools wheel",
    "python -m pip install -r requirements.txt --no-cache-dir"
] 